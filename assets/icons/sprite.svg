<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!--
  GLOBAL GROWTH — ICON SPRITE
  ---------------------------------------------------------------------------
  One 24x24 stroke system. Every symbol inherits fill/stroke from its symbol
  element, so an icon takes the colour of its parent via currentColor.

  Usage:  <svg class="gg-icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>

  Safari does not support referencing an external SVG file from <use>, so
  main.js fetches this file once and injects it inline. Do not link to it
  directly with href="/assets/icons/sprite.svg#id".
-->

